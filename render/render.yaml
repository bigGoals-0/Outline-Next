services:
  - type: web
    name: outline-next-server
    runtime: docker
    plan: starter
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: OUTLINE_UPLOAD_DIR
        value: /var/outline/uploads
      - key: DATABASE_URL
        fromDatabase:
          name: outline-next-postgres
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: outline-next-postgres
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: outline-next-postgres
          property: password

databases:
  - name: outline-next-postgres
    plan: starter
